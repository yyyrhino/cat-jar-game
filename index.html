<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="猫猫罐，一只躲进罐子里的小猫。">
    <title>猫猫罐</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css?v=0.4.0">
    <link rel="stylesheet" href="./finale.css?v=0.4.0">
  </head>
  <body>
    <main class="game" aria-labelledby="game-title">
      <h1 id="game-title" class="sr-only">猫猫罐</h1>
      <header class="hud" aria-label="游戏状态">
        <div class="affection">
          <svg class="heart" viewBox="0 0 48 44" aria-hidden="true">
            <path d="M24 38C19 33.8 5 24.1 5 14.3 5 8.6 8.8 5 14.2 5 18.3 5 21.7 7.4 24 11.1 26.3 7.4 29.7 5 33.8 5 39.2 5 43 8.6 43 14.3 43 24.1 29 33.8 24 38Z"/>
          </svg>
          <div class="affection-track" role="progressbar" aria-label="好感度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 / 100">
            <div class="affection-fill"></div>
          </div>
          <span class="affection-feedback" aria-hidden="true" hidden></span>
        </div>
        <button class="reset" type="button" aria-label="重置" title="重置" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9a8 8 0 1 1-.1 5M4.5 3.5V9H10"/></svg>
        </button>
      </header>
      <section class="stage" id="game-stage" aria-label="小猫和三个罐子" aria-describedby="interaction-hint">
        <p class="loading" role="status">小猫马上就来…</p>
      </section>
      <p class="hint" id="interaction-hint">探头时按住摸摸 · 起跳时让开小手</p>
      <p class="sr-only" id="announcer" role="status" aria-live="polite"></p>
      <noscript>请启用 JavaScript，和小猫见面。</noscript>
    </main>
    <script type="module" src="./app.js?v=0.4.2"></script>
  </body>
</html>
